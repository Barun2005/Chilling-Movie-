<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="chillingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="50%" stop-color="#ff4d4d" />
      <stop offset="100%" stop-color="#b20710" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#chillingGrad)" filter="url(#glow)"/>
  <text x="50" y="68" font-family="'Outfit', 'Inter', sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle">C</text>
  <circle cx="75" cy="25" r="8" fill="#46d369" filter="url(#glow)"/>
</svg>